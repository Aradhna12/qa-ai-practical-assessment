name: Postman API Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  api-tests:
    name: Newman API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Postman collection (CI)
        run: npm run postman:run:ci

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-junit-report
          path: postman/reports/junit-results.xml
          if-no-files-found: warn

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Postman API Tests
          path: postman/reports/junit-results.xml
          reporter: java-junit
          fail-on-error: true
